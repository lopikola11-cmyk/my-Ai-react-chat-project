<!DOCTYPE html>
<html>
  <head>
    <title>chatbot</title>
  </head>
  <body>
    <div class="js-container"></div>


    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
    
const containor=document.querySelector('.js-container');
/*<div>
  {sender==='robot' &&  <img src="robot.png" width="20px"/>}
  {message}
  {sender==='user' &&  <img src="user.png" width="20px"/>}
 
</div>*/

<button></button>
const Chat_input=({inputText,setInputText})=>{ 

  


      function saveInputMessage(event) {
           inputText=event.target.value;
};


   function sendInputMessage(){ 
setInputText(inputText);
console.log(inputText);
   }

  return(<>
  <input size="30" onChange={saveInputMessage}/>
  <button onClick={sendInputMessage}>send</button>
  </>)
}





const Chat_Message=({message,sender,key,chatMessages,setChatMessages})=>{ 


 


 

const sendMessage=()=>{ 
setChatMessages([...chatMessages,{message:'hello',sender:'user',id:crypto.randomUUID()}]);
console.log(chatMessages)

};

 

return(
  <>

  <button onClick={sendMessage}>send message</button>
{chatMessages.map(chat=>{ 

  return  <div key={chat.id}>{chat.sender==='robot'&& <img src="robot.png" width="30"/> 
}
{chat.message}
{chat.sender==='user'&& <img src="user.png" width="30"/>}

    </div>
})}</>
)
}






const Lola=()=>{ 
 const [inputText,setInputText]=React.useState('');
const [chatMessages,setChatMessages]= React.useState([{message:'hello',sender:'user',id:crypto.randomUUID()},
  {message:'i m good thank you',sender:'robot',id:crypto.randomUUID()},
 {message:'you are welcome',sender:'user',id:crypto.randomUUID()},
 {message:'how can i help you',sender:'robot',id:crypto.randomUUID()}]);
return (
  <>
  <Chat_input inputText={inputText} setInputText={setInputText}/>
<Chat_Message chatMessages={chatMessages} setChatMessages={setChatMessages}/>
 </>
)

}
  

ReactDOM.createRoot(containor).render(<Lola/>);
</script>
  </body>
</html>
