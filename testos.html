<!DOCTYPE html>
<html>
  <head>
    <title>chatbot</title>
    <style>
      html{ height: 100%; }
      .All{
        height: 100vh;
        width: 100%;
        display: flex;
      }
      .input-Messages{
        width: 100%;
        min-width: 1200px;
        margin-left: auto;
        margin-right: auto;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      body{
        height: 100%;
        width: 100%;
        margin: 0px;
        padding:0px;
        background-color: rgb(197, 197, 221);
      }
      .input-div {
        display: flex;     
        flex-direction: column;          
        justify-content: center;
        align-items: center;     
        margin: 10px auto;              
        min-width: 400px;
        max-width: 1000px;
        gap: 10px;
      }
      .input-div button{ 
        background-color: green;
        width: 80px;
        height: 35px;
      }
      .input-div input{ 
        min-width: 400px;
        width: 600px;
        max-width: 1200px;
        flex-grow: 1;
        height: 30px;
      }
      .div-chatMessages{
        display: flex;
        flex-direction: column;
        background-color: yellow;
        justify-content: center;
        width: 75%;
      }
      .robot,.user{
        display: flex;
        width: 100%;
        gap: 10px;
        justify-content: center;
        margin-top: 10px;
      }
      .table {
        position: fixed;
        top: 0;
        left: 0;
        height: 100vh;
        width: 100px;
        display: flex;
        flex-direction: column;
        margin: 0;
        padding: 0;
        background-color: #1e293b;
      }
      .sidebar {
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        align-items: center;
        width: 100px;
        height: 100%;
        background-color: #1e293b;
      }
      .sidebar a {
        padding: 12px 16px;
        text-decoration: none;
        color: white;
        border-radius: 8px;
        margin: 6px 0;
        text-align: center;
        transition: background 0.3s;
      }
      .sidebar a:hover {
        background-color: #334155;
        cursor: pointer;
      }
      .sidebar a.active {
        background-color: #3b82f6;
      }

      /* New chat history styling */
      .history-item {
        width: 100%;
        background-color: #334155;
        color: white;
        padding: 10px;
        margin-top: 10px;
        text-align: center;
        border-radius: 6px;
        font-size: 12px;
      }
    </style>
  </head>

  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
    <script src="https://unpkg.com/supersimpledev/chatbot.js"></script>
    <script src="https://unpkg.com/supersimpledev/babel.js"></script>

    <script type="text/babel">

function className(){ 
  return 'bomba';
}

const container = document.querySelector('.js-container');

/* -------- Chat_input -------- */
const Chat_input = ({ 
  setChatMessages, 
  chatMessages, 
  keyValue, setKey, 
  ID, setID,
  chatHistory, setChatHistory
}) => { 

  const [inputText, setInputText] = React.useState('');

  function saveInputMessage(event) {
    setInputText(event.target.value);
  }

  function sendMessage() {

    // FIRST MESSAGE → generate ID + update browser URL
    if (keyValue === 0) {
      const newID = crypto.randomUUID();
      setID(newID);
      setKey(1);

      history.pushState({}, "", `?id=${newID}`);

      // ⭐ Add chat history item (NO prev used)
      setChatHistory([...chatHistory, { id: newID }]);
    } 
    else {
      setKey(keyValue + 1);
    }

    // Add messages
    setChatMessages([
      ...chatMessages,
      { message: inputText, sender: 'user', id: crypto.randomUUID() },
      { message: Chatbot.getResponse(inputText), sender: 'robot', id: crypto.randomUUID() }
    ]);

    setInputText('');
  }

  return (
    <div className='input-div'>
      <input size="30" onChange={saveInputMessage} value={inputText} placeholder='Ask me'/>
      <button onClick={sendMessage} className={className()}>send message</button>
    </div>
  );
}

/* -------- Chat_Message -------- */
const Chat_Message = ({ chatMessages }) => { 
  return (
    <div className='div-chatMessages'>
      {chatMessages.map(chat => (
        <div key={chat.id} className={chat.sender==='robot'?'robot':'user'}>
          {chat.sender === 'robot' && <img src="robot.png" width="30"/>}
          {chat.message}
          {chat.sender === 'user' && <img src="user.png" width="30"/>}
        </div>
      ))}
    </div>
  );
}

/* -------- AiStyling -------- */
const AiStyling = ({ chatHistory }) => {
  return (
    <div className='table'>
      <div className="sidebar">
        <a href="ToAmerica.html" target="_blank" className="active">New chat</a>
        <a href="#">Search chats</a>
        <a href="#">Library</a>
        <a href="#">Chats</a>
      </div>

      <div className='chat-history'>
        {chatHistory.map(entry => (
          <div className="history-item" key={entry.id}>
            Chat ID:<br />{entry.id}
          </div>
        ))}
      </div>
    </div>
  );
}


/* -------- Lola -------- */
const Lola = () => { 

  const [key, setKey] = React.useState(0);
  const [ID, setID] = React.useState(null);

  const [chatMessages, setChatMessages] = React.useState([]);
  const [chatHistory, setChatHistory] = React.useState([]);  // ⭐ NEW

  return (
    <div className='All'>
      <AiStyling chatHistory={chatHistory} />

      <div className='input-Messages'>
        <Chat_input 
          setChatMessages={setChatMessages}
          chatMessages={chatMessages}
          keyValue={key} setKey={setKey}
          ID={ID} setID={setID}

          chatHistory={chatHistory}
          setChatHistory={setChatHistory}
        />

        <Chat_Message chatMessages={chatMessages} />
      </div>
    </div>
  );
}

ReactDOM.createRoot(container).render(<Lola/>);

    </script>
  </body>
</html>
