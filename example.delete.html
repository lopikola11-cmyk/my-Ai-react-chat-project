<!DOCTYPE html>
<html>
  <head>
    <title>chatbot</title>
    <style>
      html{ height: 100%;}
      .All{
        height: 100vh;
        width: 100%;
display: flex;

      }
.input-Messages{
  width: 100%;
  min-width: 1200px;
  margin-left: auto;
  margin-right: auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  
}

.bomba {
  background-color: red;
}
body{
  height: 100%;
  width: 100%;
  margin: 0px;
  padding:0px;
  background-color: rgb(197, 197, 221);
}
.input-div {

  display: flex;     
  flex-direction: column;          
  justify-content: center;
  align-items: center;     
  margin: 10px auto;              
  min-width: 400px;
  max-width: 1000px;
  gap: 10px;
  
}
.input-div button{ 
background-color: green;
width: 80px;
height: 35px;
}
.input-div input{ 
  min-width: 400px;
  width: 600px;
  max-width: 1200px;min-width: 400px;
  flex-grow: 1;
  height: 30px;
}
.div-chatMessages{
  display: flex;
  flex-direction: column;
  background-color: yellow;
  justify-content: center;
  
  width: 75%;
 
 
  
}
.robot,.user{
  display: flex;
  width: 100%;
  gap: 10px;
  justify-content: center;
  margin-top: 10px;
}

.table {
  position: fixed;     /* 👈 This is the key! */
  top: 0;
  left: 0;
  height: 100vh;       /* full screen height */
  width: 100px;        /* same width as your sidebar */
  display: flex;
  flex-direction: column;
  margin: 0;
  padding: 0;
  background-color: #1e293b; /* to match your sidebar color */
  z-index: 1000;       /* keeps it above other elements */
}
.sidebar {
  display: flex;
  flex-direction: column;   /* Stack items vertically */
  justify-content: flex-start;
  align-items: center;
  width: 100px;
  height: 100%;
  flex-grow: 1;
 

            /* Full screen height */
  background-color: #1e293b;
  margin-bottom: 0px;
 
}

.sidebar a {
  
  padding: 12px 16px;
  text-decoration: none;
  color: white;
  border-radius: 8px;
  margin: 6px 0;
  text-align: center;
  transition: background 0.3s;
}

.sidebar a:hover {
  background-color: #334155;
  cursor: pointer;
}

.sidebar a.active {
  background-color: #3b82f6;
}









    </style>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
    <script src="https://unpkg.com/supersimpledev/chatbot.js"></script>
    <script src="https://unpkg.com/supersimpledev/babel.js"></script>

    <script type="text/babel">
  let key=0;
  let ID;


function className(){ 
  return 'bomba';
}

const containor=document.querySelector('.js-container');

/* -------- Chat_input -------- */
const Chat_input = ({ setChatMessages }) => { 
  const [inputText, setInputText] = React.useState('');

  function saveInputMessage(event) {
    setInputText(event.target.value);
  }

  function sendMessage() { 

    setChatMessages((chatMessages) => {
      key++;
     
     if (key===1) {
       ID=crypto.randomUUID();
      console.log(ID);
     history.pushState({}, "", `example.delete.html?id=${ID}`);
     };
     console.log(key);
      const newMessages = [
        ...chatMessages,
        { message: inputText, sender: 'user', id: crypto.randomUUID() },
        { message: Chatbot.getResponse(inputText), sender: 'robot', id: crypto.randomUUID() }
      ];
      return newMessages;
    });
    setInputText('');
  }

  return (
    <div className='input-div'>
      <input size="30" onChange={saveInputMessage} value={inputText} placeholder='Ask me'/>
      <button onClick={sendMessage} className={className()}>send message</button>
    </div>
  );
}

/* -------- Chat_Message -------- */
const Chat_Message = ({ chatMessages }) => { 
  const chatRef = React.useRef(null);

  React.useEffect(() => { 
    console.log('updated');
    console.log(chatRef.current);
  }, [chatMessages]);

  return (
    
    <div className='div-chatMessages'>
      {chatMessages.map(chat => (
        
        <div key={chat.id} className={chat.sender==='robot'?'robot':'user'}>
          {chat.sender === 'robot' && <img src="robot.png" width="30"/>}
          {chat.message}
          {chat.sender === 'user' && <img src="user.png" width="30"/>}
        </div>
        
      ))}
      </div>
  
  );
}

const AiStyling=()=>{

return(
  <div className='table'>
    <div className="sidebar">
  <a href={key===1?`example.delete.html?name=${ID}`:'example.delete.html'}   target="_blank"className="active">New chat</a>
  <a href="#">Search chats</a>
  <a href="#" >Library</a>
  <div></div>
  <a href="#">Chats</a>
 
    
  </div>
    </div>
  

)



}

/* -------- Lola -------- */
const Lola = () => { 

  const [chatMessages, setChatMessages] = React.useState([
    { message: 'hello', sender: 'user', id: crypto.randomUUID() },
    { message: 'i m good thank you', sender: 'robot', id: crypto.randomUUID() },
    { message: 'you are welcome', sender: 'user', id: crypto.randomUUID() },
    { message: 'how can i help you', sender: 'robot', id: crypto.randomUUID() }
  ]);

  return (
    <div className='All'>
        <AiStyling className='table'/>


      <div className='input-Messages'>
        <Chat_input setChatMessages={setChatMessages}/>
      <Chat_Message chatMessages={chatMessages}/>
        </div>
      
      
    </div>
  );
}

ReactDOM.createRoot(containor).render(<Lola/>);
    </script>
  </body>
</html>
